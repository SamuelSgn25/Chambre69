<!DOCTYPE html>
<html>
<head>
  <title>Image Inspector</title>
  <style>
    body { font-family: sans-serif; background: #222; color: #fff; margin: 20px; }
    h2 { border-bottom: 1px solid #C9A96E; padding-bottom: 5px; color: #C9A96E; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .card { background: #333; padding: 10px; border-radius: 8px; text-align: center; }
    img { max-width: 100%; height: 180px; object-fit: contain; background: #111; border-radius: 4px; }
    .path { font-size: 10px; word-break: break-all; margin-top: 8px; color: #ccc; }
  </style>
</head>
<body>
  <h1>Chambre 69 Image Inspector</h1>
  <div id="content"></div>

    ];

    const content = document.getElementById('content');
    data.forEach(item => {
      const h2 = document.createElement('h2');
      h2.textContent = item.category;
      content.appendChild(h2);

      const grid = document.createElement('div');
      grid.className = 'grid';
      item.paths.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        const img = document.createElement('img');
        // Serve through Vite's public folder if we copy them, or let's use the local file system (wait, browser cannot load files outside workspace easily unless served)
        // Wait, let's copy them to public inspect_images so they can be viewed
        img.src = '/inspect_images' + p;
        const pathDiv = document.createElement('div');
        pathDiv.className = 'path';
        pathDiv.textContent = p.split('/').pop();
        card.appendChild(img);
        card.appendChild(pathDiv);
        grid.appendChild(card);
      });
      content.appendChild(grid);
    });
  </script>
</body>
</html>
